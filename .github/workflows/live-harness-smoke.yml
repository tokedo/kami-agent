# Full live-harness smoke (README, Verification tier 4) against a REAL
# kami-harness checkout at the pinned SHA. Never gates PRs: runs on manual
# dispatch ONLY. Run it manually before tagging a release and on any
# harness pin bump — chain-RPC flakiness must not block unrelated PRs, and
# the pinned harness cannot drift under CI.
#
# The weekly cron was removed at 0.6.0. It billed real provider calls on
# org keys every Monday for a surface no live run was using, and a
# provider flake mailed a red build nobody was going to act on. Re-enable
# the schedule around a live window if a standing signal is wanted there;
# outside one it is spend without a reader.
#
# Uses list_accounts as the read-only harness tool: the CI checkout has no
# wallet keys, so account-bound reads are exercised only in operator-run
# local smokes (KAMI_SMOKE_HARNESS=real with a real roster).

name: live-harness-smoke

on:
  workflow_dispatch:

env:
  # 4.0.0 (87b2231): 100 tools, harness tools_hash 3cd1c08c...4315, and a
  # handshake whose standing text this scaffold shows the model (SPEC D1;
  # kami-agent 0.7.0+ pairs with 4.0.0+). The committed fixture was
  # re-recorded at this ref under Python 3.13
  # (scripts/record_harness_surface.py), standing text included, and the
  # live-vs-recorded assertions below compare that text byte for byte. No
  # kami-lens daemon runs here, so the roster brief degrades to the
  # harness's own unavailability error, as tier 4 always has.
  HARNESS_PIN: 87b22315dc35326b5c6ff34ca793afa385d79d6f # kami-harness 4.0.0 (87b2231)

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tokedo/kami-harness
          ref: ${{ env.HARNESS_PIN }}
          path: kami-harness
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Install harness dependencies
        run: |
          # --python 3.13 is load-bearing, not tidiness. The harness's
          # agent-visible tool descriptions come from docstrings, and
          # CPython 3.13 strips their common leading indentation at
          # compile time while 3.12 retains it. Running the harness on
          # 3.12 therefore serves the SAME tools with ~3.2k more
          # description characters, a different tools_hash, and a context
          # floor ~420 tokens higher on Anthropic — a surface production
          # never serves, since the image is python:3.13-slim. The runner
          # default (/usr/bin/python3, currently 3.12) silently measured
          # that surface until the fixture-fidelity assertion caught it.
          uv venv --python 3.13 kami-harness/.venv-smoke
          uv pip install -r kami-harness/executor/requirements.txt \
            -p kami-harness/.venv-smoke/bin/python
      - name: Minimal harness config (roster template; no keys)
        run: cp kami-harness/accounts/roster.yaml.template kami-harness/accounts/roster.yaml
      - name: Tri-provider smoke vs real harness
        env:
          KAMI_SMOKE_HARNESS: real
          KAMI_HARNESS_DIR: ${{ github.workspace }}/kami-harness
          KAMI_SMOKE_HARNESS_TOOL: list_accounts
          # The harness (v1.3.0+) refuses to start without MAINNET_RPC_URL.
          # Real endpoint: repo secret if set, else a keyless public one —
          # the canned session is read-only and never dials mainnet, but
          # the live tier should mirror production config, not a stub.
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
        run: uv run pytest tests/smoke -q -s
