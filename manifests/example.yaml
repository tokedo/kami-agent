# Run manifest — copied verbatim into run/config.yaml by `kami-agent init`
# (plus the generated wallet_address). Immutable once a run starts; re-runs
# re-pin new SHAs in a new manifest.
run_id: dev-smoke-001
provider: anthropic # anthropic | openai | google
model: claude-haiku-4-5

price_table: # pinned list prices, USD per million tokens (cache-aware, SPEC P7.2)
  input_usd_per_mtok: 1.0
  output_usd_per_mtok: 5.0
  cache_read_usd_per_mtok: 0.10 # anthropic 5m: 0.1 x input rate
  cache_write_usd_per_mtok: 1.25 # anthropic 5m: 1.25 x input rate

params:
  max_tokens: 4096
  temperature: null # sent only when set; some models reject it
  reasoning_effort: null # anthropic → output_config.effort; openai native; google not sent

caps: # SPEC D3 (session_token_cap sized per model — no default)
  session_token_cap: 120000
  session_tool_cap: 50
  max_consecutive_errors: 5
  retry_max_attempts: 5
  tool_timeout_s: 120 # watchdog on ONE tool call (SPEC P2). Must stay above
    # the harness's own call box, KAMI_CALL_BUDGET_S (default 90, kami-harness
    # 4.0.0), with margin for the last receipt: a watchdog that fires first
    # tells the model the call failed while the harness is still running it.
    # Raise the two together (docs/packaging.md)
  tool_result_max_bytes: 65536
  wait_max_seconds: 300 # upper bound on ONE `wait` call (SPEC P10); the wait
    # tool is exempt from the watchdog above, which exists to catch a hung
    # harness call and would otherwise kill a wait that ran its full clamp.
    # Worst-case in-session waiting is session_tool_cap x this — size the
    # two together (SPEC P5, D1)
  journal_max_bytes: 32768 # rolling bound on run/journal/sessions.jsonl (SPEC
    # P15). Below tool_result_max_bytes on purpose: reading the WHOLE journal
    # in one call is then never truncated
  repetition_identical_cap: 5 # repetition breaker: consecutive identical calls (same signature)
  repetition_window: 30 # repetition breaker: trailing-call window size
  repetition_min_distinct: 4 # repetition breaker: distinct-signature floor in a full window
  repetition_same_tool_error_cap: 8 # repetition breaker: consecutive same-tool error/revert run

# Knowledge-delivery rung (SPEC D3, P10, P13). Cumulative, in order:
#   control     — base scaffold + session-start gas balances
#   orientation — + the pinned core-loop paragraph (prompts/orientation.txt)
#   search      — + the search_reference tool over reference/
#   pushed      — + lens/harness result enrichment (THEIR runtime flags:
#                 nothing changes agent-side beyond the recorded value)
#   planning    — + prompts/planning.txt and the plan-file injection
# Absent = control. An unknown value fails at build_run_config. A profile
# at or above `search` carries one more scaffold tool, so its
# session_start.tools_hash differs from a lower profile's BY DESIGN.
scaffold_profile: control

budget_usd: 10.0
t_max_days: 30
workspace_quota_bytes: 10485760
lock_stale_s: 7200

wake: # must match the bounds frozen into prompts/system.txt
  min_minutes: 5
  max_minutes: 1440
  default_minutes: 60

chain_rpc_url: https://jsonrpc-yominet-1.anvil.asia-southeast.initia.xyz

# Harness presentation mode, passed through to the child as
# PRESENTATION_MODE and recorded on every session_start. Passed through
# unvalidated on purpose: a mode the pinned harness does not implement
# must abort the handshake at `init`, loudly, rather than be normalized
# here into a silently different run.
presentation_mode: envelope

harness: # spawned per session as a stdio child (SPEC D1)
  command: python3
  args: [executor/server.py]
  cwd: /opt/kami-harness
  handshake_timeout_s: 60
  # kami-harness 4.0.0+ (pairs with kami-agent 0.7.0+): its handshake carries
  # standing text every session shows the model, and its nonce ledger must sit
  # on a persistent volume — KAMI_LANE_DIR, set by the packaged image to
  # /srv/run/harness-lanes (docs/packaging.md). The scaffold passes its own
  # environment through to this child; an `env:` map here wins over it.

# World-state daemon (SPEC D7). From 0.6.0 the scaffold reads it directly
# for ONE thing: which daemon is serving, recorded on every session_start
# so a host running a different build than this manifest pins is visible
# in the record. Everything the agent perceives — the session-start
# roster included — arrives through the harness, which reads the same
# daemon over the same socket, so these must name the same one.
# socket_path unset resolves KAMI_LENS_SOCKET, then the platform default.
# The roster tool sends no account argument: the daemon fills it from its
# own configured default operator, and until that is set the brief
# degrades visibly every session, which is the expected early-run shape.
lens:
  socket_path: null
  timeout_s: 30
  enabled: true

pins: # recorded on run_start; provisioning enforces them
  agent_sha: ""
  harness_sha: c036554f6e4a15754f2f2249e68bb2fe12000d26 # kami-harness 4.2.0 (4.0.0+ pairs with kami-agent 0.7.0+)
  lens_sha: 62c3d8598dddcf3d791fdd4d7a57259db852971a # kami-lens 1.0.2 (1.0.1+ required for correct reads)
  gdd_sha: 531e4de49bdbc71cbbfa727849e53f6ef5fad85c # repo cleanup only; game content byte-identical to c2c5a1b
